name: Build and Release Project Nox APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nox-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-release:
    name: Build one APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore persistent development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: project-nox-development-signing-key-v1
      - name: Prepare stable signing key
        env:
          NOX_KEYSTORE_BASE64: ${{ secrets.NOX_KEYSTORE_BASE64 }}
          NOX_KEYSTORE_PASSWORD: ${{ secrets.NOX_KEYSTORE_PASSWORD }}
          NOX_KEY_ALIAS: ${{ secrets.NOX_KEY_ALIAS }}
          NOX_KEY_PASSWORD: ${{ secrets.NOX_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$NOX_KEYSTORE_BASE64" ] && [ -n "$NOX_KEYSTORE_PASSWORD" ] && [ -n "$NOX_KEY_ALIAS" ] && [ -n "$NOX_KEY_PASSWORD" ]; then
            echo "$NOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nox-release.keystore"
            echo "NOX_KEYSTORE_PATH=$RUNNER_TEMP/nox-release.keystore" >> "$GITHUB_ENV"
            echo "NOX_KEYSTORE_PASSWORD=$NOX_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "NOX_KEY_ALIAS=$NOX_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "NOX_KEY_PASSWORD=$NOX_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using the repository's configured signing key."
          else
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            {
              echo "NOX_KEYSTORE_PATH=$HOME/.android/debug.keystore"
              echo "NOX_KEYSTORE_PASSWORD=android"
              echo "NOX_KEY_ALIAS=androiddebugkey"
              echo "NOX_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
            echo "Using the cached development signing key."
          fi
      - name: Set unique Android version for this build
        run: |
          python3 - <<'PY'
          import os, re
          path = "app/build.gradle"
          text = open(path, encoding="utf-8").read()
          run = int(os.environ["GITHUB_RUN_NUMBER"])
          version_code = 1000 + run
          version_name = f"0.4.{run}"
          text, count_code = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", text, count=1)
          text, count_name = re.subn(r"versionName\s+'[^']+'", f"versionName '{version_name}'", text, count=1)
          if count_code != 1 or count_name != 1:
              raise SystemExit("Could not set app versionCode/versionName")
          open(path, "w", encoding="utf-8").write(text)
          print(f"Building Project Nox {version_name} (versionCode {version_code})")
          PY
      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP "versionName '\\K[^']+" app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "filename=Nox release $VERSION.apk" >> "$GITHUB_OUTPUT"
      - name: Prepare Ubuntu Base and PRoot before Android asset merging
        run: |
          gradle --no-daemon :app:prepareNoxLinuxRuntime
          test -s app/src/debug/assets/ubuntu-base-arm64.tar.gz
          ls -lh app/src/debug/assets/ubuntu-base-arm64.tar.gz
      - name: Build exactly one APK
        run: gradle --no-daemon --no-build-cache --rerun-tasks assembleDebug
      - name: Diagnose merged Ubuntu asset
        run: |
          echo "Source asset:"
          ls -lh app/src/main/assets/ubuntu-base-arm64.tar.gz
          echo "Merged assets directory:"
          find app/build/intermediates -name "ubuntu-base-arm64.tar.gz" -print || true
          echo "APK asset listing:"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "ubuntu-base|assets/" | head -40 || true
      - name: Verify Ubuntu Base is packaged in the APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if ! unzip -l "$APK" | grep -q 'assets/ubuntu-base-arm64.tar.gz'; then
            echo "ERROR: Ubuntu Base archive is missing from the APK assets. Refusing to publish an incomplete APK."
            exit 1
          fi
          echo "Verified: Ubuntu Base ARM64 archive is embedded in the APK."
          unzip -l "$APK" | grep 'assets/ubuntu-base-arm64.tar.gz'
      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Nox release ${{ steps.version.outputs.version }}.apk"
      - name: Upload the single APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nox-release-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/debug/Nox release ${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
      - name: Generate changelog
        run: |
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGES="$(git log --pretty=format:'- %s (%h)' "$PREVIOUS_TAG..HEAD")"
          else
            CHANGES="$(git log -n 20 --pretty=format:'- %s (%h)' HEAD)"
          fi
          if [ -z "$CHANGES" ]; then CHANGES="- Build and maintenance updates."; fi
          {
            echo "# Project Nox ${{ steps.version.outputs.version }}"
            echo
            echo "## Changes"
            echo "$CHANGES"
            echo
            echo "## Installation"
            echo "Install the APK over your existing Project Nox version. If Android reports a signing mismatch, remove the older test build once."
          } > release-notes.md
      - name: Publish GitHub Release with one APK and changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Project Nox ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: app/build/outputs/apk/debug/Nox release ${{ steps.version.outputs.version }}.apk
          fail_on_unmatched_files: true
