name: Build and Release Project Nox APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nox-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-release:
    name: Build, sign and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare stable signing key (optional until repository secrets are configured)
        env:
          NOX_KEYSTORE_BASE64: ${{ secrets.NOX_KEYSTORE_BASE64 }}
          NOX_KEYSTORE_PASSWORD: ${{ secrets.NOX_KEYSTORE_PASSWORD }}
          NOX_KEY_ALIAS: ${{ secrets.NOX_KEY_ALIAS }}
          NOX_KEY_PASSWORD: ${{ secrets.NOX_KEY_PASSWORD }}
        run: |
          if [ -n "$NOX_KEYSTORE_BASE64" ] && [ -n "$NOX_KEYSTORE_PASSWORD" ] && [ -n "$NOX_KEY_ALIAS" ] && [ -n "$NOX_KEY_PASSWORD" ]; then
            echo "$NOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nox-release.keystore"
            {
              echo "NOX_KEYSTORE_PATH=$RUNNER_TEMP/nox-release.keystore"
              echo "NOX_KEYSTORE_PASSWORD=$NOX_KEYSTORE_PASSWORD"
              echo "NOX_KEY_ALIAS=$NOX_KEY_ALIAS"
              echo "NOX_KEY_PASSWORD=$NOX_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Stable signing key configured."
          else
            echo "::warning::Signing secrets are missing. This APK will use a temporary debug key and may not install over a previous build."
          fi
      - name: Set increasing version code
        run: |
          python3 - <<'PY'
          import os, re
          path = "app/build.gradle"
          text = open(path, encoding="utf-8").read()
          version_code = 1000 + int(os.environ["GITHUB_RUN_NUMBER"])
          text, count = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", text, count=1)
          if count != 1:
              raise SystemExit("Could not update versionCode in app/build.gradle")
          open(path, "w", encoding="utf-8").write(text)
          PY
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project-Nox-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Read app version
        id: version
        run: |
          VERSION="$(grep -oP "versionName '\\K[^']+" app/build.gradle)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release with changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Project Nox ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
