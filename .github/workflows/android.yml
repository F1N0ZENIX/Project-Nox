name: Build and Release Project Nox APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nox-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-release:
    name: Build, sign and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore persistent development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: project-nox-development-signing-key-v1
      - name: Prepare stable signing key
        env:
          NOX_KEYSTORE_BASE64: ${{ secrets.NOX_KEYSTORE_BASE64 }}
          NOX_KEYSTORE_PASSWORD: ${{ secrets.NOX_KEYSTORE_PASSWORD }}
          NOX_KEY_ALIAS: ${{ secrets.NOX_KEY_ALIAS }}
          NOX_KEY_PASSWORD: ${{ secrets.NOX_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$NOX_KEYSTORE_BASE64" ] && [ -n "$NOX_KEYSTORE_PASSWORD" ] && [ -n "$NOX_KEY_ALIAS" ] && [ -n "$NOX_KEY_PASSWORD" ]; then
            echo "$NOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nox-release.keystore"
            echo "NOX_KEYSTORE_PATH=$RUNNER_TEMP/nox-release.keystore" >> "$GITHUB_ENV"
            echo "NOX_KEYSTORE_PASSWORD=$NOX_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "NOX_KEY_ALIAS=$NOX_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "NOX_KEY_PASSWORD=$NOX_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using the repository's configured signing key."
          else
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            {
              echo "NOX_KEYSTORE_PATH=$HOME/.android/debug.keystore"
              echo "NOX_KEYSTORE_PASSWORD=android"
              echo "NOX_KEY_ALIAS=androiddebugkey"
              echo "NOX_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
            echo "Using the cached development signing key."
          fi
      - name: Set increasing version code
        run: |
          python3 - <<'PY'
          import os, re
          path = "app/build.gradle"
          text = open(path, encoding="utf-8").read()
          version_code = 1000 + int(os.environ["GITHUB_RUN_NUMBER"])
          text, count = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", text, count=1)
          if count != 1:
              raise SystemExit("Could not update versionCode in app/build.gradle")
          open(path, "w", encoding="utf-8").write(text)
          PY
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project-Nox-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP "versionName '\\K[^']+" app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Generate changelog
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREVIOUS_TAG="$(git tag --list 'v*-build.*' --sort=-version:refname | head -n 1)"
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGES="$(git log --pretty=format:'- %s (%h)' "$PREVIOUS_TAG..HEAD")"
          else
            CHANGES="$(git log -n 20 --pretty=format:'- %s (%h)' HEAD)"
          fi
          if [ -z "$CHANGES" ]; then CHANGES="- Build and maintenance updates."; fi
          {
            echo "# Project Nox ${{ steps.version.outputs.version }}"
            echo
            echo "## Changes"
            echo "$CHANGES"
            echo
            echo "## Installation"
            echo "Download app-debug.apk and install it over your existing Project Nox installation."
          } > release-notes.md
      - name: Publish GitHub Release with changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Project Nox ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body_path: release-notes.md
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
